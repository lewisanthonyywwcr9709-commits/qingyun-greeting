<style>
@font-face {
  font-family: WeddingSong;
  src: url("assets/song-regular.otf") format("opentype");
  font-display: swap;
  font-weight: 400;
}
@font-face {
  font-family: WeddingSong;
  src: url("assets/song-semibold.otf") format("opentype");
  font-display: swap;
  font-weight: 600;
}
:root {
  color-scheme: light;
  --gold: #ffe5ab;
  --ink: #691d27;
  --paper: #f4e3b6;
  --silk: url("assets/silk-v2.jpg");
  font-family: WeddingSong, "Songti SC", SimSun, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 46%, #682926, #39171c 62%, #271216);
}
::selection { background: #efc3a8; color: #541322; }
main {
  display: grid;
  min-height: 100vh;
  min-height: 100svh;
  place-items: center;
  padding: clamp(10px, 3vw, 27px);
}
.wedding-canvas {
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  width: min(100%, 28rem);
  aspect-ratio: 2 / 3;
  background: #641715 var(--silk) center / contain no-repeat;
  box-shadow: 0 22px 56px #20060eb0;
}
.wedding-canvas::before {
  position: absolute;
  inset: 9px;
  z-index: 2;
  border: 1px solid #e7bc768a;
  pointer-events: none;
  content: "";
}
.card {
  grid-area: 1 / 1;
  width: 100%;
  position: relative;
  text-align: center;
}
.cover {
  display: grid;
  place-items: center;
  padding: 24px 12px;
  color: var(--gold);
}
.cover-copy {
  display: grid;
  justify-items: center;
  padding: 4px 0 0;
  transform: translateY(-1.2%);
}
.emblem {
  display: grid;
  place-items: center;
  width: 57px;
  height: 61px;
  margin-bottom: clamp(17px, 5vw, 28px);
  border: 1px solid #f3c678a8;
  border-radius: 46% 46% 44% 44%;
  box-shadow: inset 0 0 0 3px #6a130e, inset 0 0 0 4px #dcac6580;
  font-size: 31px;
  line-height: 1;
}
h1, h2, p, figure, blockquote { margin: 0; }
h1, h2 {
  font-family: WeddingSong, "Songti SC", SimSun, serif;
  font-weight: 400;
  line-height: 1.13;
}
h1 { font-size: clamp(49px, 14vw, 83px); white-space: nowrap; }
.recipient {
  margin-top: 14px;
  padding-left: .17em;
  color: #fff0cf;
  font-size: clamp(20px, 5.4vw, 26px);
  letter-spacing: .17em;
}
button {
  min-height: 46px;
  font: inherit;
  cursor: pointer;
}
button:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
.open-button {
  margin-top: clamp(23px, 6vw, 36px);
  padding: 8px 23px;
  border: 1px solid #dca96c;
  border-radius: 2px;
  background: #50100d;
  color: #fff0c6;
  font-size: 17px;
}
.open-button:hover { background: #731b15; }
.letter {
  width: calc(100% - 40px);
  margin-block: 20px;
  box-shadow: 0 14px 34px #26070cb5;
}
.letter-body {
  position: relative;
  padding: clamp(24px, 7vw, 36px) clamp(11px, 4vw, 26px) 20px;
  background-color: var(--paper);
  background-image: radial-gradient(ellipse at 48% 36%, #fff1d7 32%, #f1dfb7 100%);
  border: 1px solid #fcebc9;
}
.letter h2 {
  font-size: clamp(37px, 10vw, 53px);
}
.dedication {
  display: block;
  margin-bottom: 4px;
  font: 21px WeddingSong, "Songti SC", SimSun, serif;
  letter-spacing: .12em;
}
.letter h2:focus { outline: none; }
.poem {
  margin-top: clamp(24px, 7vw, 35px);
}
.poem blockquote {
  font-size: clamp(31px, 8.9vw, 45px);
  line-height: 1.37;
  letter-spacing: .08em;
}
.poem blockquote span { display: block; }
.poem cite {
  display: block;
  margin-top: 10px;
  color: #74513e;
  font-size: 14px;
  font-style: normal;
}
.sign-off {
  max-width: 290px;
  margin: clamp(27px, 8vw, 42px) auto 0;
  padding-top: 21px;
  border-top: 1px solid #c09b77;
}
.signatures {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  row-gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: clamp(16px, 4.45vw, 19px);
}
.signatures li { flex: 0 0 25%; white-space: nowrap; }
.seal {
  display: inline-block;
  margin-top: 13px;
  padding: 3px 6px 1px;
  border: 1px solid #a44940;
  font: 20px WeddingSong, "Songti SC", SimSun, serif;
}

.letter.reveal { animation: unfurl 530ms cubic-bezier(.19,1,.22,1) both; }
@keyframes unfurl {
  from { clip-path: inset(0 0 65%); transform: translateY(12px); }
  to { clip-path: inset(0 0 0); transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .letter.reveal { animation: none; } }
.gold-corner {
  position: absolute;
  width: 36px;
  height: 36px;
  z-index: 3;
  color: #f4d08c;
  pointer-events: none;
}
.gold-corner--tl { top: 8px; left: 8px; }
.gold-corner--tr { top: 8px; right: 8px; transform: scaleX(-1); }
.gold-corner--bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
.gold-corner--br { bottom: 8px; right: 8px; transform: scale(-1); }
.gold-corner::before, .gold-corner::after,
.gold-corner i::before, .gold-corner i::after {
  position: absolute;
  box-sizing: border-box;
  border: 1px solid currentColor;
  content: "";
}
.gold-corner::before {
  left: 3px;
  top: 3px;
  width: 25px;
  height: 8px;
  border-right: 0;
  border-bottom: 0;
  border-radius: 12px 0 0 0;
}
.gold-corner::after {
  left: 3px;
  top: 3px;
  width: 8px;
  height: 25px;
  border-right: 0;
  border-bottom: 0;
  border-radius: 10px 0 0 0;
}
.gold-corner i::before {
  left: 6px;
  top: 6px;
  width: 8px;
  height: 6px;
  border-radius: 0 75% 0 75%;
  transform: rotate(23deg);
}
.gold-corner i::after {
  left: 6px;
  top: 6px;
  width: 6px;
  height: 8px;
  border-radius: 0 75% 0 75%;
  transform: rotate(-23deg);
}
/* Gold flecks stay outside the ivory message sheet. */
.wedding-glints {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}
.wedding-glints i {
  position: absolute;
  inset-inline-start: var(--x);
  inset-block-start: var(--y);
  width: var(--size, 4px);
  height: var(--size, 4px);
  border-radius: 50%;
  background: #fff0bb;
  box-shadow: 0 0 5px 1px #f8bc55;
  opacity: .52;
  animation: silk-glint var(--time, 4s) ease-in-out var(--delay, 0s) infinite;
}
.wedding-glints i:nth-child(3n) {
  width: 8px;
  height: 8px;
  clip-path: polygon(50% 0, 63% 38%, 100% 50%, 63% 62%, 50% 100%, 37% 62%, 0 50%, 37% 38%);
  border-radius: 0;
  box-shadow: none;
}
@keyframes silk-glint {
  0%, 100% { opacity: .42; transform: translateY(0) scale(.8); }
  46% { opacity: 1; transform: translateY(-5px) scale(1.18); }
}
@media (prefers-reduced-motion: reduce) {
  .wedding-glints i { animation: none; }
}
/* The title, poetry and sign-off each share the card's optical axis. */
.cover-copy {
  padding: 0;
  transform: none;
}
.emblem {
  width: 51px;
  height: 51px;
  margin-bottom: 20px;
  border-radius: 50%;
  border-color: #f3c678ba;
  background: #730f10;
  box-shadow: inset 0 0 0 3px #730f10, inset 0 0 0 4px #dcac6575;
  font-size: 26px;
  font-weight: 600;
}
h1, h2 { font-weight: 600; }
h1 {
  display: grid;
  gap: .07em;
  font-size: clamp(50px, 14vw, 71px);
  line-height: 1.04;
}
h1 span {
  letter-spacing: .12em;
  padding-inline-start: .12em;
}
.recipient {
  display: grid;
  justify-items: center;
  row-gap: 7px;
  margin-top: 16px;
  padding: 0;
  white-space: nowrap;
  font-size: clamp(15px, 4.55vw, 21px);
  line-height: 1.4;
}
.recipient-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #f2c886;
  font-size: .8em;
}
.recipient-label::before, .recipient-label::after {
  width: clamp(13px, 4vw, 23px);
  height: 1px;
  background: #eabe75af;
  content: "";
}
.recipient-names {
  color: #fff0cf;
  letter-spacing: .07em;
  padding-inline-start: .07em;
}
.open-button {
  margin-top: 24px;
  background: #651112;
  font-size: 15px;
  letter-spacing: .06em;
}
.letter-body {
  padding-top: clamp(22px, 6.8vw, 33px);
  padding-bottom: clamp(22px, 6.5vw, 33px);
}
.letter h2 { font-size: clamp(34px, 9.4vw, 48px); }
.dedication {
  margin-bottom: 8px;
  padding-inline-start: .12em;
  font: 400 clamp(16px, 4.5vw, 20px) WeddingSong, "Songti SC", SimSun, serif;
}
.wish {
  position: relative;
  display: inline-block;
  white-space: nowrap;
}
.punctuation {
  position: absolute;
  inset-inline-start: calc(100% + .1em);
  width: .54em;
  text-align: left;
}
.joining-line {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 19px;
  height: 12px;
}
.joining-line::before, .joining-line::after {
  width: 30px;
  height: 1px;
  background: #bb8a65;
  content: "";
}
.joining-line::before { margin-inline-end: 8px; }
.joining-line::after { margin-inline-start: 8px; }
.joining-line i {
  width: 9px;
  height: 9px;
  border: 1px solid #a86c43;
  transform: rotate(45deg);
}
.joining-line i + i { margin-inline-start: -3px; }
.poem { margin-top: 14px; }
.poem blockquote {
  font-size: clamp(26px, 7.45vw, 36px);
  line-height: 1.5;
  color: #752b30;
}
.poem blockquote span { padding-inline-start: .08em; }
.poem cite { margin-top: 9px; font-size: 12px; }
.sign-off {
  margin-top: 22px;
  padding-top: 15px;
}
.signatures {
  row-gap: 7px;
  font-size: clamp(15px, 4.25vw, 18px);
}
.seal {
  margin-top: 13px;
  padding: 3px 7px 4px;
  font: 600 14px WeddingSong, "Songti SC", SimSun, serif;
}
@media (max-width: 360px) {
  .letter { margin-block: 13px; }
  .letter-body { padding-block: 17px 18px; }
  .dedication { margin-bottom: 5px; }
  .joining-line { margin-top: 11px; }
  .poem { margin-top: 9px; }
  .poem blockquote { line-height: 1.34; }
  .poem cite { margin-top: 6px; }
  .sign-off { margin-top: 15px; padding-top: 11px; }
  .seal { margin-top: 8px; }
}

    <section class="card cover" id="cover" aria-labelledby="cover-title" hidden>

<audio id="card-music" loop preload="none" data-src="assets/positive-happy.mp3"></audio>
<script>
const cover = document.querySelector("#cover");
const letter = document.querySelector("#letter");
const openCard = document.querySelector("#open-card");
const letterTitle = document.querySelector("#letter-title");
const music = document.querySelector("#card-music");

function playMusic() {
  if (!music.hasAttribute("src")) music.src = music.dataset.src;
  music.play().catch(() => {});
}

letter.hidden = true;
cover.hidden = false;

openCard.addEventListener("click", () => {
  cover.hidden = true;
  letter.hidden = false;
  letter.classList.add("reveal");
  letterTitle.focus();
  playMusic();
});

</script>
