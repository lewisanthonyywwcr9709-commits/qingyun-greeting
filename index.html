<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d44">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="敬贺陈甫乙履新。一鸣从此始，相望青云端。林维、吴章一等十六位朋友敬贺。">
  <meta property="og:title" content="敬贺陈甫乙履新">
  <meta property="og:description" content="一鸣从此始，相望青云端。十六位朋友敬贺。">
  <meta property="og:type" content="website">
  <title>敬贺陈甫乙履新</title>
  <style>:root{color-scheme:light;--ink:#123d44;--gold:#ddc18a;--paper:#fbf8f0;--serif:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}
*{box-sizing:border-box}body{margin:0;background:#e9edeb;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #a37530;outline-offset:6px}main{min-height:100vh;min-height:100svh;display:flex;align-items:center;flex-direction:column;justify-content:center;padding:32px 20px max(20px,env(safe-area-inset-bottom))}.card{position:relative;isolation:isolate;width:min(100%,490px);background:var(--paper);box-shadow:0 24px 65px #153d4520}.letter{padding:36px 36px 25px;min-height:675px;position:relative;border:1px solid #b7a16f70;outline:1px solid #b7a16f50;outline-offset:-13px;visibility:hidden;opacity:0;transform:translateY(12px);transition:opacity 1s .25s,transform 1s .25s,visibility 0s .25s}.letter-heading{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:15px;color:#866531;font-size:14px;letter-spacing:.45em;padding-left:.45em}.small-rule{width:24px;height:1px;background:#ad8f5a}h1{margin:26px 0 0;display:flex;gap:12px;align-items:baseline;justify-content:center;font-weight:500;font-size:29px;letter-spacing:.12em;outline:none}h1 span{font-size:15px;letter-spacing:.1em;font-weight:400}.poem{display:flex;flex-direction:row-reverse;justify-content:center;gap:42px;margin:34px 0 30px}.poem p{margin:0;writing-mode:vertical-rl;font-size:38px;line-height:1.45;letter-spacing:.21em;font-weight:500}.poem p:last-child{padding-top:30px}.punctuation{font-size:.66em}.signatures{border-top:1px solid #b6a37e55;padding-top:24px}.signatures ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));list-style:none;margin:0;padding:0;column-gap:10px;row-gap:13px;text-align:center;font-size:16px;line-height:1.45;letter-spacing:.09em}.respectfully{font-size:15px;letter-spacing:.3em;text-align:center;margin:18px 0 0;color:#806434}.cover{position:absolute;inset:0;background:var(--ink);color:var(--gold);z-index:2;transform-origin:left center;transition:transform 1.25s cubic-bezier(.22,.72,.2,1),opacity .9s ease,visibility 0s 1.3s;backface-visibility:hidden;overflow:hidden}.cover:before{content:"";position:absolute;inset:13px;border:1px solid #ddc18a60;pointer-events:none}.cover-inner{height:100%;min-height:675px;display:flex;align-items:center;flex-direction:column;padding:54px 24px 40px;background:linear-gradient(112deg,#ffffff05,transparent 40%,#00000012)}.occasion{margin:0;font-size:17px;letter-spacing:.5em;padding-left:.5em}.cover-title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:30px}.cover-title p{font-size:15px;letter-spacing:.4em;margin:14px 0;padding-left:.4em}.cover-title h2{font-size:43px;letter-spacing:.3em;font-weight:400;margin:12px 0;padding-left:.3em}.open-button{border:1px solid #ddc18a99;background:transparent;color:var(--gold);min-width:116px;min-height:48px;padding:10px 25px;font-size:18px;letter-spacing:.2em;transition:background .2s,color .2s}.open-button:hover{background:var(--gold);color:var(--ink)}.cover-signature{font-size:14px;line-height:1.8;letter-spacing:.05em;margin:45px 0 0;text-align:center;color:#ddc18ad9}.card.open .cover{transform:perspective(1400px) rotateY(-95deg);opacity:0;visibility:hidden;pointer-events:none}.card.open .letter{visibility:visible;opacity:1;transform:none}.actions{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px;min-height:44px;color:#596c6d;font-size:14px;letter-spacing:.08em}.actions button{color:var(--ink);border:0;border-bottom:1px solid #123d4455;background:transparent;min-height:44px;padding:9px 0}.actions span[aria-hidden]{color:#99a7a5}.status{margin:7px 0 0;max-width:490px;text-align:center;min-height:20px;line-height:1.6;font-family:system-ui,sans-serif;font-size:14px;color:#4a605f}#copy-fallback{width:min(100%,490px);padding-top:12px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.6}#share-url{display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #91a49d;border-radius:0;color:var(--ink);background:#fff;font-size:16px}[hidden]{display:none!important}.noscript{max-width:490px}
@media(max-width:420px){main{padding:20px 16px}.letter{padding:30px 24px 26px;min-height:642px}.cover-inner{min-height:642px;padding:47px 22px 35px}.poem{gap:31px;margin:32px 0 28px}.poem p{font-size:35px}h1{font-size:26px}.signatures ul{font-size:15px;column-gap:5px;letter-spacing:.02em}.cover-title h2{font-size:39px}.cover-signature{font-size:13px}.actions{gap:13px}}
.poem{margin-bottom:18px}.poem-credit{margin:0 0 25px;text-align:center;color:#806434;font-size:14px;line-height:1.8;letter-spacing:.12em}.poem-credit span{display:block;font-size:13px;letter-spacing:.04em}.actions{flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}.card.open .cover{transform:none}}
</style>
  
</head>
<body>
  <main>
    <div class="card" id="card">
      <section class="letter" id="letter" aria-label="履新贺词" inert>
        <header class="letter-heading"><span>履新志喜</span><span class="small-rule" aria-hidden="true"></span></header>
        <h1 tabindex="-1" id="recipient"><span>敬贺</span>陈甫乙<span>履新</span></h1>
        <div class="poem" aria-label="一鸣从此始，相望青云端。">
          <p aria-hidden="true">一鸣从此始<span class="punctuation">，</span></p>
          <p aria-hidden="true">相望青云端<span class="punctuation">。</span></p>
        </div>
        <p class="poem-credit">唐 · 刘禹锡<span>《送韦秀才道冲赴制举》</span></p>
        <footer class="signatures">
          <ul aria-label="送祝福的人">
            <li>林维</li><li>吴章一</li><li>陈灵坤</li><li>邱婕</li>
            <li>马秀招</li><li>邹书</li><li>许鹭璐</li><li>章灵景</li>
            <li>黄婕</li><li>林植</li><li>翁娈</li><li>郑源</li>
            <li>钱梦宾</li><li>陈贝铃</li><li>张泽艺</li><li>张帅</li>
          </ul>
          <p class="respectfully">同贺</p>
        </footer>
      </section>
      <section class="cover" id="cover" aria-label="请陈甫乙开启贺卡">
        <div class="cover-inner">
          <p class="occasion">履新志喜</p>
          <div class="cover-title"><p>呈</p><h2>陈甫乙</h2><p>亲启</p></div>
          <button id="open-card" class="open-button" aria-controls="letter" aria-expanded="false">启 笺</button>
          <p class="cover-signature">林维、吴章一等十六位朋友 敬贺</p>
        </div>
      </section>
    </div>
    <audio id="music" src="./modern-warmth.m4a" autoplay loop preload="auto" playsinline></audio>
    <nav class="actions" aria-label="贺卡操作">
      <button id="music-toggle" aria-pressed="false">播放配乐</button>
      <span aria-hidden="true">/</span>
      <button id="share-card">分享贺卡</button>
      <span id="replay-divider" aria-hidden="true" hidden>/</span>
      <button id="replay-card" hidden>重读此笺</button>
      <span id="share-note" hidden></span>
    </nav>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div id="copy-fallback" hidden>
      <label for="share-url">长按或选中下方链接复制，再粘贴到微信</label>
      <input id="share-url" readonly type="url">
    </div>
    <noscript><p class="noscript">敬贺陈甫乙履新：一鸣从此始，相望青云端。</p><style>.cover{display:none}.letter{visibility:visible!important;opacity:1!important;transform:none!important}</style></noscript>
  </main>
<script>(() => {
  'use strict';
  const card = document.getElementById('card');
  const cover = document.getElementById('cover');
  const letter = document.getElementById('letter');
  const openButton = document.getElementById('open-card');
  const replay = document.getElementById('replay-card');
  const note = document.getElementById('share-note');
  const status = document.getElementById('status');
  const fallback = document.getElementById('copy-fallback');
  const shareUrl = document.getElementById('share-url');
  const music = document.getElementById('music');
  const musicToggle = document.getElementById('music-toggle');
  music.volume = 0.48;
  let musicPreference = true;
  music.autoplay = true;
  music.loop = true;
  function updateMusicState() {
    const playing = !music.paused;
    musicToggle.textContent = playing ? '暂停配乐' : '播放配乐';
    musicToggle.setAttribute('aria-pressed', String(playing));
  }
  async function playMusic(quiet = false) {
    if (musicPreference === false) return;
    try {
      await music.play();
      if (musicPreference === false) music.pause();
      if (status.textContent === '轻触贺卡，即可开启配乐。') status.textContent = '';
    }
    catch { if (!quiet && musicPreference !== false) status.textContent = '轻触贺卡，即可开启配乐。'; }
    updateMusicState();
  }
  music.addEventListener('play', updateMusicState);
  music.addEventListener('pause', updateMusicState);
  musicToggle.addEventListener('click', () => {
    if (music.paused) { musicPreference = true; playMusic(); }
    else { musicPreference = false; music.pause(); }
  });
  // Request audible autoplay; retry on a real visitor gesture if blocked.
  // Explicitly pausing always takes priority over automatic retries.
  function resumeOnGesture(event) {
    if (event.target === musicToggle || musicToggle.contains(event.target)) return;
    if (musicPreference !== false && music.paused) playMusic(true);
  }
  document.addEventListener('pointerdown', resumeOnGesture);
  document.addEventListener('touchend', resumeOnGesture, { passive: true });
  document.addEventListener('keydown', resumeOnGesture);
  music.addEventListener('canplay', () => {
    if (musicPreference !== false && music.paused) playMusic(true);
  }, { once: true });
  playMusic();
  const url = new URL(location.href); url.search = ''; url.hash = '';
  const canonicalUrl = url.href;
  openButton.addEventListener('click', () => {
    if (musicPreference !== false) playMusic();
    letter.inert = false;
    card.classList.add('open');
    openButton.setAttribute('aria-expanded', 'true');
    replay.hidden = false;
    document.getElementById('replay-divider').hidden = false;
    note.hidden = true;
    setTimeout(() => { if(card.classList.contains('open')) document.getElementById('recipient').focus({preventScroll:true}); }, 350);
    cover.inert = true;
  });
  replay.addEventListener('click', () => {
    cover.inert = false;
    card.classList.remove('open');
    openButton.setAttribute('aria-expanded', 'false');
    letter.inert = true;
    replay.hidden = true;
    document.getElementById('replay-divider').hidden = true;
    note.hidden = false;
    openButton.focus({preventScroll:true});
    status.textContent = '';
    fallback.hidden = true;
  });
  function manualCopy() {
    fallback.hidden = false;
    shareUrl.value = canonicalUrl;
    shareUrl.focus();
    shareUrl.select();
    status.textContent = '复制链接后，可发给陈甫乙或转给其他朋友。';
  }
  document.getElementById('share-card').addEventListener('click', async () => {
    status.textContent = '';
    fallback.hidden = true;
    if (/MicroMessenger/i.test(navigator.userAgent || '')) {
      status.textContent = '请点微信右上角“…” → “发送给朋友”，使用微信的网页分享。';
      return;
    }
    if (navigator.share) {
      try {
        await navigator.share({ title: '敬贺陈甫乙履新', text: '一鸣从此始，相望青云端。', url: canonicalUrl });
        return;
      } catch (error) { if (error.name === 'AbortError') return; }
    }
    try {
      if (!navigator.clipboard || !window.isSecureContext) { manualCopy(); return; }
      await navigator.clipboard.writeText(canonicalUrl);
      status.textContent = '链接已复制，可粘贴到微信发送；朋友也可继续转发。';
    } catch { manualCopy(); }
  });
})();
</script></body>
</html>
